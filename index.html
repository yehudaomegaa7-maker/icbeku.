<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICBEKU - System Kasir</title>
    <style>
        :root {
            --primary-blue: #0088cc;
            --accent-yellow: #ffcc00;
            --dark-gray: #333333;
            --light-bg: #f4f7f6;
            --white: #ffffff;
            --danger: #e74c3c;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-bg);
            color: var(--dark-gray);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        .main-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background-color: var(--white);
            padding: 15px 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .header h1 {
            color: var(--primary-blue);
            font-size: 24px;
        }

        .role-selector {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: #006699;
        }

        .btn-outline {
            background-color: transparent;
            border: 2px solid var(--primary-blue);
            color: var(--primary-blue);
        }

        .btn-outline.active, .btn-outline:hover {
            background-color: var(--primary-blue);
            color: var(--white);
        }

        .btn-danger {
            background-color: var(--danger);
            color: var(--white);
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-card {
            background-color: var(--white);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
        }

        .menu-card:hover {
            border-color: var(--primary-blue);
            transform: translateY(-2px);
        }

        .menu-card h3 {
            font-size: 16px;
            margin-bottom: 8px;
        }

        .menu-card .price {
            color: var(--primary-blue);
            font-weight: bold;
            font-size: 18px;
        }

        .sidebar {
            width: 380px;
            background-color: var(--white);
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            box-shadow: -2px 0 5px rgba(0,0,0,0.05);
        }

        .cart-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .cart-item-info h4 {
            font-size: 14px;
        }

        .cart-item-info p {
            font-size: 12px;
            color: #777;
        }

        .cart-item-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-qty {
            width: 25px;
            height: 25px;
            border-radius: 50%;
            border: 1px solid #ccc;
            background: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .cart-footer {
            padding: 20px;
            border-top: 1px solid #eee;
            background-color: #fafafa;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .summary-row.total {
            font-weight: bold;
            font-size: 20px;
            color: var(--primary-blue);
            border-top: 1px dashed #ccc;
            padding-top: 10px;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }

        .manager-dashboard {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .stat-card {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            border-left: 5px solid var(--primary-blue);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .stat-card h3 {
            font-size: 13px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-card .value {
            font-size: 22px;
            font-weight: bold;
            color: var(--dark-gray);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-panel">
            <div class="header">
                <h1>ICBEKU POS</h1>
                <div class="role-selector">
                    <button class="btn btn-outline active" id="btn-kasir" onclick="switchRole('kasir')">Kasir</button>
                    <button class="btn btn-outline" id="btn-manajer" onclick="switchRole('manajer')">Manajer</button>
                </div>
            </div>

            <!-- TAMPILAN KASIR -->
            <div id="kasir-view">
                <h2>Daftar Menu</h2>
                <div class="menu-grid" id="menu-container"></div>
            </div>

            <!-- TAMPILAN MANAJER -->
            <div id="manajer-view" class="manager-dashboard">
                <h2>Dashboard Manajer</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <h3>TOTAL OMSET</h3>
                        <div class="value" id="stat-omset">Rp 0</div>
                    </div>
                    <div class="stat-card">
                        <h3>TOTAL TRANSAKSI</h3>
                        <div class="value" id="stat-transaksi">0</div>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <button class="btn btn-danger" onclick="resetData()">Reset Semua Transaksi</button>
                </div>
            </div>
        </div>

        <!-- SIDEBAR KERANJANG (KASIR) -->
        <div class="sidebar" id="sidebar-cart">
            <div class="cart-header">
                <h2>Pesanan Saat Ini</h2>
            </div>
            <div class="cart-items" id="cart-container">
                <p style="text-align: center; color: #999; margin-top: 20px;">Keranjang kosong</p>
            </div>
            <div class="cart-footer">
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="cart-total">Rp 0</span>
                </div>
                <div class="payment-methods">
                    <button class="btn btn-primary" style="width: 100%; grid-column: span 2;" onclick="processTransaction()">Bayar Sekarang</button>
                </div>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT & FIREBASE -->
    <script type="module">
        // 1. IMPORT FIREBASE SDK
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 2. KONFIGURASI FIREBASE (GANTI DENGAN KODE DARI FIREBASE CONSOLE ANDA)
        const firebaseConfig = {
            apiKey: "PASTE_API_KEY_ANDA_DI_SINI",
            authDomain: "PASTE_PROJECT_ID_ANDA.firebaseapp.com",
            databaseURL: "https://PASTE_PROJECT_ID_ANDA-default-rtdb.firebaseio.com",
            projectId: "PASTE_PROJECT_ID_ANDA",
            storageBucket: "PASTE_PROJECT_ID_ANDA.appspot.com",
            messagingSenderId: "PASTE_SENDER_ID_ANDA",
            appId: "PASTE_APP_ID_ANDA"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // DATA MENU
        const MENU_LIST = [
            { id: 'C8', name: 'CONE 8K', price: 8000 },
            { id: 'C10', name: 'CONE 10K', price: 10000 },
            { id: 'S8', name: 'SUNDAE 8K', price: 8000 },
            { id: 'S10', name: 'SUNDAE 10K', price: 10000 }
        ];

        let cart = [];
        let transactions = JSON.parse(localStorage.getItem('icbeku_transactions')) || [];

        // SYNC KODE KE WINDOW (Agar fungsi tombol onclick HTML bisa membacanya)
        window.switchRole = switchRole;
        window.addToCart = addToCart;
        window.updateQty = updateQty;
        window.processTransaction = processTransaction;
        window.resetData = resetData;

        // Render Menu
        function renderMenu() {
            const container = document.getElementById('menu-container');
            container.innerHTML = MENU_LIST.map(item => `
                <div class="menu-card" onclick="addToCart('${item.id}')">
                    <h3>${item.name}</h3>
                    <div class="price">Rp ${item.price.toLocaleString()}</div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = MENU_LIST.find(m => m.id === id);
            const exist = cart.find(c => c.id === id);
            if (exist) {
                exist.qty++;
            } else {
                cart.push({ ...item, qty: 1 });
            }
            renderCart();
        }

        function updateQty(id, delta) {
            const index = cart.findIndex(c => c.id === id);
            if (index !== -1) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) cart.splice(index, 1);
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cart-container');
            const totalEl = document.getElementById('cart-total');

            if (cart.length === 0) {
                container.innerHTML = `<p style="text-align: center; color: #999; margin-top: 20px;">Keranjang kosong</p>`;
                totalEl.innerText = 'Rp 0';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h4>${item.name}</h4>
                            <p>Rp ${item.price.toLocaleString()} x ${item.qty}</p>
                        </div>
                        <div class="cart-item-controls">
                            <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
                            <span>${item.qty}</span>
                            <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.innerText = `Rp ${total.toLocaleString()}`;
        }

        function processTransaction() {
            if (cart.length === 0) return alert('Keranjang masih kosong!');

            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const newTx = {
                id: Date.now(),
                timestamp: new Date().toISOString(),
                items: cart,
                total: total
            };

            // 1. Simpan ke LocalStorage
            transactions.push(newTx);
            localStorage.setItem('icbeku_transactions', JSON.stringify(transactions));

            // 2. Simpan Realtime ke Firebase Database
            push(ref(db, 'transactions'), newTx)
                .then(() => {
                    alert('Transaksi Berhasil Tersimpan ke Firebase!');
                })
                .catch((err) => {
                    console.error('Error Firebase:', err);
                    alert('Transaksi tersimpan lokal (Gagal sync ke Firebase).');
                });

            cart = [];
            renderCart();
            updateManagerDashboard();
        }

        function switchRole(role) {
            const kasirView = document.getElementById('kasir-view');
            const manajerView = document.getElementById('manajer-view');
            const sidebar = document.getElementById('sidebar-cart');
            const btnKasir = document.getElementById('btn-kasir');
            const btnManajer = document.getElementById('btn-manajer');

            if (role === 'kasir') {
                kasirView.classList.remove('hidden');
                sidebar.classList.remove('hidden');
                manajerView.style.display = 'none';
                btnKasir.classList.add('active');
                btnManajer.classList.remove('active');
            } else {
                kasirView.classList.add('hidden');
                sidebar.classList.add('hidden');
                manajerView.style.display = 'flex';
                btnManajer.classList.add('active');
                btnKasir.classList.remove('active');
                updateManagerDashboard();
            }
        }

        function updateManagerDashboard() {
            const totalOmset = transactions.reduce((sum, t) => sum + t.total, 0);
            document.getElementById('stat-omset').innerText = `Rp ${totalOmset.toLocaleString()}`;
            document.getElementById('stat-transaksi').innerText = transactions.length;
        }

        function resetData() {
            if (confirm("PERINGATAN: Hapus seluruh riwayat transaksi lokal?")) {
                localStorage.removeItem('icbeku_transactions');
                transactions = [];
                updateManagerDashboard();
                alert("Riwayat lokal berhasil dibersihkan.");
            }
        }

        // Inisialisasi awal
        renderMenu();
    </script>
</body>
</html>
